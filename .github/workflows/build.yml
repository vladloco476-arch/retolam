name: build
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Compilar
        run: gradle assembleDebug --no-daemon
      - name: Renombrar
        run: cp app/build/outputs/apk/debug/app-debug.apk Retolam.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Retolam-apk
          path: Retolam.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Retolam v1.0.${{ github.run_number }}
          files: Retolam.apk
